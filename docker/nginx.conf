server {
    listen 80;
    server_name localhost;

    # Le dossier public de Laravel
    root /var/www/public;

    index index.php index.html index.htm;

    # Logs (optionnels)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gestion des routes Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Traitement des fichiers PHP via php-fpm
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Swagger UI assets
    location /docs/asset/ {
        alias /var/www/vendor/swagger-api/swagger-ui/dist/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # Gestion de la documentation JSON Swagger - traite tout ce qui commence par /docs
    location ~ ^/docs/? {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gestion des assets Swagger statiques - doit être APRÈS la location PHP
    location /docs/ {
        alias /var/www/public/docs/;
        try_files $uri $uri/ =404;
    }

    # Sécurisation des fichiers cachés
    location ~ /\.(?!well-known).* {
        deny all;
    }
}