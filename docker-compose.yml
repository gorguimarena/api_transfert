services:
  app:
    build:
      context: .
      dockerfile: docker/development/workspace/Dockerfile
    container_name: back_end
    working_dir: /var/www
    volumes:
      - .:/var/www
    expose:
      - "9000"
    depends_on:
      - db
    command: php-fpm

  nginx:
    image: nginx:latest
    container_name: back_end_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/development/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: back_end_postgres_db
    environment:
      POSTGRES_DB: laravel_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
